        <style>
:root{--paper:#f5f0e6;--card:#fffdf8;--ink:#231f1a;--ink-soft:#4f473e;--muted:#8c8275;--line:#e3d9c6;--seal:#b23a2b;--seal-soft:rgba(178,58,43,.08);--gold:#a9833f;--serif:"Noto Serif SC", "Source Han Serif SC", "Songti SC", "STSong", "SimSun", serif;--radius:6px}*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}body{background:radial-gradient(circle at 20% 0%, rgba(169,131,63,.08), transparent 40%), radial-gradient(circle at 100% 100%, rgba(178,58,43,.05), transparent 45%), var(--paper);min-height:100vh;color:var(--ink);font-family:var(--serif);margin:0;line-height:1.7}button{font:inherit;color:inherit}h1,h2,h3,p{margin-top:0}.shell{max-width:640px;margin:0 auto;padding:24px 16px 56px}.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:16px;padding:28px 24px;position:relative;box-shadow:0 1px rgba(35,31,26,.04),0 10px 30px -18px rgba(35,31,26,.25)}.kicker{letter-spacing:.2em;color:var(--muted);margin-bottom:10px;font-size:12px}.title{margin-bottom:14px;font-size:30px;font-weight:900;line-height:1.35}.title em{color:var(--seal);font-style:normal}.subtitle{margin-bottom:6px;font-size:22px;font-weight:800}.lead{color:var(--ink-soft);font-size:15px}.hint{color:var(--muted);font-size:13px}.seal{writing-mode:vertical-rl;border:2px solid var(--seal);width:52px;height:52px;color:var(--seal);letter-spacing:.1em;opacity:.85;justify-content:center;align-items:center;font-size:16px;font-weight:900;display:flex;position:absolute;top:22px;right:22px;transform:rotate(6deg)}.stats{grid-template-columns:1fr 1fr;gap:10px;margin:22px 0;padding:0;list-style:none;display:grid}.stats li{border:1px solid var(--line);border-radius:var(--radius);color:var(--ink-soft);padding:12px;font-size:13px}.stats b{color:var(--seal);font-size:24px;line-height:1.2;display:block}.explain{color:var(--ink-soft);margin-top:18px;font-size:14px}.explain summary{cursor:pointer;color:var(--gold);padding:6px 0;font-weight:700}.explain p{margin:8px 0 0}.btn{border-radius:var(--radius);letter-spacing:.08em;cursor:pointer;width:100%;padding:14px 18px;font-size:16px;font-weight:800;transition:transform .12s,background .12s;display:block}.btn:active{transform:translateY(1px)}.primary{background:var(--ink);color:var(--paper);border:1px solid var(--ink)}.primary:hover{background:#3a332b}.ghost{border:1px solid var(--line);color:var(--ink-soft);background:0 0;margin-top:10px}.ghost:hover{border-color:var(--muted)}button:focus-visible{outline:2px solid var(--seal);outline-offset:2px}.choices{flex-direction:column;gap:10px;margin:20px 0;display:flex}.choice{text-align:left;border:1px solid var(--line);border-radius:var(--radius);cursor:pointer;background:0 0;align-items:center;gap:14px;width:100%;padding:14px 16px;font-size:15px;transition:border-color .12s,background .12s;display:flex}.choice:hover{border-color:var(--muted);background:rgba(35,31,26,.02)}.choice.selected{border-color:var(--seal);background:var(--seal-soft)}.choice strong{font-size:16px;display:block}.choice small{color:var(--muted);font-size:12px;display:block}.mark,.letter{border:1px solid var(--ink);flex:none;justify-content:center;align-items:center;width:34px;height:34px;font-weight:900;display:flex}.letter{border-color:var(--line);width:28px;height:28px;color:var(--muted);font-size:13px}.choice.selected .letter{background:var(--seal);border-color:var(--seal);color:#fff}.progress{color:var(--muted);align-items:center;gap:12px;margin-bottom:14px;font-size:13px;display:flex}.count{flex:none;min-width:52px}.track{background:var(--line);flex:1;height:3px;overflow:hidden}.bar{background:var(--seal);width:0;height:100%;transition:width .3s;display:block}.q-card{flex-direction:column;min-height:520px;display:flex}.scene{color:var(--seal);border-bottom:1px solid var(--seal);letter-spacing:.1em;align-self:flex-start;margin-bottom:14px;padding-bottom:2px;font-size:13px;display:inline-block}.q-text{font-size:20px;font-weight:800;line-height:1.55}.source{color:var(--muted);min-height:1.7em;margin-top:auto;font-size:12px}.q-nav{justify-content:space-between;gap:10px;margin-top:12px;display:flex}.nav-btn{border:1px solid var(--line);border-radius:var(--radius);cursor:pointer;color:var(--ink-soft);background:0 0;padding:10px 18px}.nav-btn[disabled]{opacity:.35;cursor:not-allowed}.banner{background:var(--seal-soft);border:1px dashed var(--seal);color:var(--seal);border-radius:var(--radius);padding:10px 14px;font-size:13px}.hero{text-align:center;padding-top:34px}.name-seal{background:var(--seal);color:#fff;justify-content:center;align-items:center;width:64px;height:64px;margin:6px auto 10px;font-size:34px;font-weight:900;display:flex;transform:rotate(-4deg)}.figure-name{letter-spacing:.1em;margin-bottom:4px;font-size:40px;font-weight:900}.figure-meta{color:var(--muted);margin-bottom:4px;font-size:14px}.legend-note{color:var(--gold);margin-bottom:4px;font-size:12px}.percent{color:var(--ink-soft);margin:14px 0 8px;font-size:14px}.percent b{color:var(--seal);font-size:36px;font-weight:900}.chip{border:1px solid var(--line);color:var(--ink-soft);border-radius:999px;padding:4px 14px;font-size:13px;display:inline-block}.says{border-left:3px solid var(--gold);text-align:left;background:rgba(169,131,63,.06);margin:20px 0 0;padding:16px 18px;font-size:18px;line-height:1.8}.says span{color:var(--muted);margin-bottom:4px;font-size:12px;display:block}.section-title{align-items:center;gap:10px;margin-bottom:14px;font-size:18px;font-weight:800;display:flex}.section-title span{border:1px solid var(--seal);width:28px;height:28px;color:var(--seal);justify-content:center;align-items:center;font-size:14px;display:inline-flex}.body{color:var(--ink-soft);margin-bottom:8px;font-size:16px}.body.muted{color:var(--muted);font-size:14px}.motto{color:var(--seal);font-size:17px;font-weight:700}.radar-wrap{max-width:340px;margin:0 auto 12px}.radar{width:100%;height:auto;display:block}.radar-label{fill:var(--ink-soft);font-size:13px;font-family:var(--serif)}.legend{text-align:center;color:var(--muted);font-size:13px}.dot{vertical-align:middle;border-top:2px solid;width:18px;height:0;margin:0 6px 3px 14px;display:inline-block}.dot.you{border-color:var(--seal)}.dot.fig{border-color:var(--gold);border-top-style:dashed}.bars{flex-direction:column;gap:8px;display:flex}.bar-row{color:var(--ink-soft);grid-template-columns:44px 1fr 32px;align-items:center;gap:10px;font-size:14px;display:grid}.bar-row b{text-align:right;color:var(--ink)}.bar-track{background:var(--line);height:6px}.bar-track i{background:var(--seal);height:100%;display:block}.grid3{gap:10px;display:grid}.note{border:1px solid var(--line);border-radius:var(--radius);color:var(--ink-soft);padding:14px 16px;font-size:14px}.note b{color:var(--ink);margin-bottom:4px;font-size:15px;display:block}.others{gap:10px;display:grid}.other{border:1px solid var(--line);border-radius:var(--radius);grid-template-rows:auto auto;grid-template-columns:1fr auto;column-gap:12px;padding:12px 16px;display:grid}.other strong{font-size:17px}.other small{color:var(--muted);grid-row:2;font-size:12px}.other b{color:var(--seal);grid-area:1/2/3;align-self:center;font-size:18px}.actions{margin:20px 0 8px}.fine{text-align:center;color:var(--muted);font-size:12px}.toast{background:var(--ink);max-width:calc(100% - 32px);color:var(--paper);border-radius:var(--radius);opacity:0;pointer-events:none;z-index:50;padding:10px 18px;font-size:14px;transition:opacity .2s,transform .2s;position:fixed;bottom:28px;left:50%;transform:translate(-50%,16px)}.toast.show{opacity:1;transform:translate(-50%)}.modal{z-index:60;background:rgba(35,31,26,.6);justify-content:center;align-items:flex-start;padding:16px;display:flex;position:fixed;top:0;bottom:0;left:0;right:0;overflow:auto}.modal-panel{background:var(--card);border-radius:var(--radius);width:min(560px,100%);margin:auto;padding:14px}.modal-head{justify-content:space-between;align-items:center;margin-bottom:10px;display:flex}.modal-close{background:var(--paper);cursor:pointer;border:0;border-radius:50%;width:40px;height:40px;font-size:22px}.modal-img{-webkit-touch-callout:default;-webkit-user-select:auto;-moz-user-select:auto;-ms-user-select:auto;user-select:auto;width:100%;height:auto;display:block}@media (min-width:600px){.grid3{grid-template-columns:repeat(3,1fr)}.others{grid-template-columns:1fr 1fr}.title{font-size:34px}}@media (prefers-reduced-motion:reduce){*{transition:none!important}}

      <script>
(function(){var e=(e,t,n,r,i,a,o,s,c=!1)=>({id:e,name:t,gender:n,era:r,role:i,vec:a,bio:o,says:s,legendary:c}),t=[e(`qinshihuang`,`秦始皇`,`male`,`秦`,`统一六国的帝王`,[96,35,80,70,50,85,60,75],`战国末年先后灭掉六国，建立中国第一个统一的中央集权王朝。推行郡县制，统一文字、度量衡与货币，影响延续了两千年。`,`别只想着赢一仗，要想着立一套规矩，让以后不必再打。`),e(`lishimin`,`李世民`,`male`,`唐`,`唐太宗 · 纳谏之君`,[90,70,65,82,70,80,55,85],`唐朝第二位皇帝，青年时南征北战，即位后开创“贞观之治”。最为后人称道的，是他能容得下魏征这样当面顶撞自己的大臣。`,`身边有敢说你不对的人，是福气，别把他们赶走。`),e(`liubang`,`刘邦`,`male`,`西汉`,`汉高祖 · 用人之君`,[82,72,60,75,65,88,45,68],`出身沛县泗水亭长，秦末起兵，在楚汉相争中击败项羽，建立汉朝。他自己说过：运筹帷幄不如张良，安抚百姓不如萧何，带兵打仗不如韩信，但他用得了这三个人。`,`不必样样都比别人强，你要会用比你强的人。`),e(`zhugeliang`,`诸葛亮`,`male`,`三国`,`蜀汉丞相`,[75,65,70,95,75,86,52,98],`辅佐刘备建立蜀汉，刘备临终白帝城托孤后，又独力支撑国政。治蜀赏罚分明，五次北伐，最终病逝于五丈原军中。`,`答应了的事，就做到最后一天。`),e(`zhangliang`,`张良`,`male`,`西汉`,`开国谋臣`,[70,55,65,96,60,60,86,55],`韩国贵族之后，青年时曾谋刺秦始皇。后来辅佐刘邦定天下，屡献关键之策；汉朝建立后主动淡出权力中心，得以善终。`,`最该出手的时候出手，最该退场的时候退场。`),e(`shangyang`,`商鞅`,`male`,`战国`,`秦国变法者`,[95,30,88,80,62,78,72,78],`卫国人，入秦后得秦孝公信任，两次主持变法：奖励耕战、推行军功爵制、设立县制。秦国由此富强，他本人却在孝公死后被车裂。`,`道理讲得再好，也要写成能执行的条文。`),e(`wanganshi`,`王安石`,`male`,`北宋`,`熙宁变法主持者`,[88,55,90,80,85,62,84,78],`北宋政治家、文学家，“唐宋八大家”之一。宋神宗时主持熙宁变法，推行青苗法、募役法等，想解决积贫积弱的问题，围绕新法的争论持续了几十年。`,`别人说“祖宗之法不可变”的时候，你要问一句：为什么？`),e(`kongzi`,`孔子`,`male`,`春秋`,`思想家 · 教育家`,[55,85,60,85,90,55,65,82],`名丘，字仲尼，儒家学派创始人。开创私人讲学的风气，主张“有教无类”，晚年整理古代典籍。弟子把他的言行编成了《论语》。`,`学了就去用，用了再回来学。`),e(`simaqian`,`司马迁`,`male`,`西汉`,`史学家`,[60,72,80,92,90,50,88,85],`继承父亲遗志撰写史书，因替李陵辩解而遭受宫刑。忍辱完成《史记》，记载上起黄帝、下至汉武帝的历史，开创纪传体通史。`,`受了委屈也别停笔，把真相留给时间。`),e(`zhangheng`,`张衡`,`male`,`东汉`,`科学家 · 文学家`,[55,50,92,95,62,55,80,55],`东汉科学家，两度担任太史令。制作了浑天仪和候风地动仪，在天文、历算上成就突出；同时也是辞赋名家，写过《二京赋》。`,`天地看着遥远，但它的规律可以被测量。`),e(`zhangqian`,`张骞`,`male`,`西汉`,`出使西域者`,[85,65,90,70,70,60,80,88],`汉武帝时应募出使西域，途中被匈奴扣留十余年，娶妻生子仍不忘使命，最终逃出继续西行。他的两次出使打通了中原与西域的联系，史称“凿空”。`,`路上被耽搁多久都不要紧，要紧的是别忘了为什么出发。`),e(`zhenghe`,`郑和`,`male`,`明`,`航海家`,[85,70,85,72,70,92,55,85],`明成祖至明宣宗年间，率领庞大船队七次远航，到访东南亚、南亚、阿拉伯半岛，最远抵达东非沿岸，比欧洲大航海早了半个多世纪。`,`船队越大，越要算清每一斗米、每一桶水。`),e(`libai`,`李白`,`male`,`唐`,`诗人`,[60,65,85,60,98,30,96,40],`盛唐诗人，诗风豪放飘逸、想象奇崛，后人称为“诗仙”。曾供奉翰林，但不久就离开长安，一生大半在漫游中度过。`,`别把自己关进别人画好的格子里。`),e(`dufu`,`杜甫`,`male`,`唐`,`诗人`,[45,96,70,82,92,40,60,85],`唐代诗人，亲历安史之乱，“三吏”“三别”等诗作深刻记录了战乱中百姓的苦难，被称为“诗史”，后世尊为“诗圣”。`,`写你看到的人间，尤其是那些没人替他们说话的人。`),e(`sushi`,`苏轼`,`male`,`北宋`,`文学家 · 书画家`,[60,85,85,75,96,58,80,70],`北宋文学家，诗、词、文、书、画皆有建树。因“乌台诗案”下狱，此后一贬黄州、再贬惠州、三贬儋州，却总能在困顿里过出滋味。`,`被贬到哪里，就在哪里好好吃饭、好好写字。`),e(`taoyuanming`,`陶渊明`,`male`,`东晋`,`田园诗人`,[55,60,60,75,82,30,98,40],`东晋诗人，几度出仕。最后一次做彭泽令只八十多天，便辞官归隐，躬耕田园。他的田园诗和《桃花源记》影响了后世无数文人。`,`不想弯腰的时候，就回家种你的菊花。`),e(`yuefei`,`岳飞`,`male`,`南宋`,`抗金名将`,[90,70,60,70,65,72,55,98],`南宋抗金名将，岳家军纪律严明，“冻死不拆屋，饿死不掳掠”。郾城大捷后被十二道金牌召回，最终以“莫须有”的罪名遇害。`,`该守的东西，一寸都不能让。`),e(`fanzhongyan`,`范仲淹`,`male`,`北宋`,`政治家 · 文学家`,[78,86,72,78,80,70,65,96],`北宋名臣，曾镇守西北抵御西夏，后主持“庆历新政”。他在《岳阳楼记》里写下“先天下之忧而忧，后天下之乐而乐”，成了士大夫的精神标杆。`,`心里装着天下，脚下也别忘了眼前的人。`),e(`guanzhong`,`管仲`,`male`,`春秋`,`齐国国相`,[80,60,80,82,70,98,55,70],`早年与鲍叔牙合伙经商，后经鲍叔牙举荐成为齐国国相。改革行政、发展盐铁和商业，辅佐齐桓公“九合诸侯，一匡天下”，成为春秋首霸。`,`仓廪实而知礼节——先让大家吃饱，再谈别的。`),e(`wangyangming`,`王阳明`,`male`,`明`,`思想家 · 军事家`,[86,70,80,92,82,65,88,80],`名守仁，因得罪宦官被贬贵州龙场，在困境中悟道，提出“心即理”“知行合一”“致良知”。后来以文官身份领兵，只用三十多天就平定了宁王之乱。`,`知道了却不去做，就等于还不知道。`),e(`yanying`,`晏婴`,`male`,`春秋`,`齐国名相`,[72,75,65,85,92,72,70,72],`历仕齐灵公、庄公、景公三朝，以节俭务实、机智善辩著称。出使楚国时，楚王几次设计羞辱他，都被他从容化解。`,`说话不必大声，站得直就够了。`),e(`mozi`,`墨子`,`male`,`战国`,`墨家创始人`,[75,92,82,80,78,70,75,90],`战国初期思想家，主张“兼爱”“非攻”，也精通机械与守城之术。听说楚国要攻宋，他步行十天十夜赶到楚国，与公输班模拟攻守，最终劝止了这场战争。`,`道理好不好，要看它能不能让更多人少受苦。`),e(`wuzetian`,`武则天`,`female`,`唐`,`中国唯一的正统女皇帝`,[96,45,85,85,70,85,80,75],`由唐高宗皇后到临朝称制，最终改国号为“周”，正式称帝。在位期间发展科举、亲自策问考生，提拔了狄仁杰等一批能臣。`,`别让任何人告诉你，某个位置不属于你。`),e(`fuhao`,`妇好`,`female`,`商`,`王后 · 统帅`,[90,60,70,70,55,70,72,92],`商王武丁的王后。甲骨文记载她多次主持祭祀，也曾率领上万人出征。1976 年，她的墓在安阳殷墟被发现，出土了大量青铜器和玉器。`,`主持祭祀和带兵出征，本来就可以是同一个人。`),e(`zhangsunhou`,`长孙皇后`,`female`,`唐`,`唐太宗皇后`,[60,96,50,85,82,80,55,80],`唐太宗的皇后，生活俭朴，不许外戚掌权。太宗被魏征顶撞后怒气冲冲，她换上朝服道贺“主明臣直”，以温和的方式保护了直言的大臣。`,`最硬的话，有时候要用最软的方式说。`),e(`shangguanwaner`,`上官婉儿`,`female`,`唐`,`女官 · 诗人`,[70,60,72,90,96,75,60,60],`祖父上官仪获罪后，她幼年随母没入宫中。因才华出众，长期为朝廷起草诏令；唐中宗时主持品评天下诗文，影响了一代文风。`,`笔握在手里，就有分量。`),e(`banzhao`,`班昭`,`female`,`东汉`,`史学家`,[55,72,60,92,86,65,70,86],`班彪之女、班固之妹。班固去世后，她奉诏续写《汉书》未完成的八表和《天文志》。她多次入宫教授皇后和贵人，被尊称为“曹大家”。`,`别人没写完的书，我来接着写。`),e(`liqingzhao`,`李清照`,`female`,`宋`,`词人`,[55,88,80,82,98,50,88,55],`婉约词派的代表。前半生与丈夫赵明诚收藏金石、唱和诗词；靖康之变后南渡，颠沛流离，晚年词作沉郁深切，“寻寻觅觅”一首传诵至今。`,`细微的心事，也值得认真写下来。`),e(`caiwenji`,`蔡文姬`,`female`,`东汉末`,`文学家`,[45,86,65,72,94,40,70,72],`蔡邕之女，精通音律。汉末战乱中被掳到南匈奴，生活了十二年，后被曹操派人用重金赎回。凭记忆默写出父亲散佚的数百篇文章，传有《悲愤诗》。`,`离乱带不走你记得的东西。`),e(`zhuowenjun`,`卓文君`,`female`,`西汉`,`才女`,[86,75,72,70,82,76,96,55],`临邛富商卓王孙之女，新寡后与司马相如相恋私奔。两人在临邛开酒舍谋生，她亲自当垆卖酒，“文君当垆”成了后世的典故。`,`日子是自己选的，酒舍也开得光明正大。`),e(`wangzhaojun`,`王昭君`,`female`,`西汉`,`出塞和亲`,[72,80,55,70,65,65,76,92],`汉元帝时的宫女，据《后汉书》记载是她主动请求出塞，嫁给匈奴呼韩邪单于。此后数十年间汉匈边境安宁，“昭君出塞”成为民族和睦的象征。`,`有些远行，是为了让更多人不必远行。`),e(`wenchenggongzhu`,`文成公主`,`female`,`唐`,`入藏和亲`,[60,90,75,70,75,72,55,90],`唐太宗时远嫁吐蕃赞普松赞干布，在吐蕃生活近四十年。她带去的典籍、工匠和农作物，促进了唐蕃之间的经济文化交流。`,`把家乡带在身上，也把新家放在心里。`),e(`fengliao`,`冯嫽`,`female`,`西汉`,`女外交家`,[76,80,70,86,95,70,72,76],`解忧公主的侍女，熟悉西域的语言和事务。乌孙王位之争时，她作为汉朝正式使节，锦车持节前往调停，史称“冯夫人”，是中国史书记载的第一位女外交官。`,`听得懂对方的话，才谈得成对方的事。`),e(`mulan`,`花木兰`,`female`,`北朝传说`,`替父从军`,[88,75,65,60,55,60,82,98],`北朝民歌《木兰诗》中的人物，女扮男装替年迈的父亲从军，征战多年后辞官还乡。她是文学形象，真实身份已无从考证。`,`该站出来的时候，别等别人替你决定你是谁。`,!0),e(`lianghongyu`,`梁红玉`,`female`,`南宋`,`抗金女将`,[92,65,70,72,70,66,72,92],`南宋名将韩世忠的妻子。建炎年间金兵南下，韩世忠在黄天荡阻击金军，相传她亲自擂鼓助战，鼓舞了宋军士气。`,`鼓声一响，就别回头。`),e(`qinliangyu`,`秦良玉`,`female`,`明末`,`女将军`,[90,70,65,75,65,84,70,96],`四川石柱土司马千乘之妻，丈夫死后代领其职。她统领的“白杆兵”多次北上抗击后金、平定地方叛乱，是正史中唯一单独立传的女将军。`,`带兵靠的不是喊声，是平日里的规矩。`),e(`xianfuren`,`冼夫人`,`female`,`南北朝至隋`,`岭南首领`,[82,90,60,86,75,88,60,90],`岭南俚族首领，历经梁、陈、隋三朝。她多次平定地方叛乱，劝导各部归附中原王朝，为岭南的安定与民族融合做出了很大贡献。`,`让一方百姓安稳，比打赢一仗更难，也更值得。`),e(`tiying`,`缇萦`,`female`,`西汉`,`上书救父`,[86,85,70,65,90,45,76,90],`名医淳于意的小女儿。父亲获罪将受肉刑，她随父进京，上书汉文帝，愿意入官为婢替父赎罪。汉文帝被打动，随后下诏废除了部分肉刑。`,`一个小人物的一封信，也可能改掉一条旧法。`),e(`huangdaopo`,`黄道婆`,`female`,`元`,`纺织技术革新者`,[70,80,95,82,65,72,82,75],`松江乌泥泾人，早年流落崖州（今海南），向黎族人学习棉纺技术。晚年回乡后改进了轧棉、弹棉、纺纱的工具并传授乡人，松江布由此闻名天下。`,`手艺要传出去，才算真的学会了。`),e(`leizu`,`嫘祖`,`female`,`上古传说`,`养蚕缫丝之祖`,[65,80,92,78,60,72,65,75],`传说中黄帝的正妃，被后世尊为教民养蚕缫丝的始祖，历代多有祭祀。她属于上古传说人物，事迹难以确考。`,`把身边寻常的东西，变成大家都能用的本事。`,!0),e(`xiedaoyun`,`谢道韫`,`female`,`东晋`,`才女`,[72,65,75,85,95,50,90,62],`谢安的侄女，以“未若柳絮因风起”咏雪而闻名，“咏絮之才”由此而来。孙恩之乱时丈夫王凝之遇害，她仍持刀出门迎敌。`,`才情是自己的，谁也拿不走。`),e(`dengsui`,`邓绥`,`female`,`东汉`,`和熹皇后`,[85,82,65,85,70,92,60,88],`东汉和帝的皇后，和帝去世后临朝称制十余年。当时水旱灾害连年，她裁减宫中用度、赈济灾民，也重视教育，亲自督促宗室子弟读书。`,`灾年里省下的每一分，都是给百姓的。`),e(`fengtaihou`,`冯太后`,`female`,`北魏`,`文明太后 · 改革者`,[92,60,85,88,70,86,70,82],`北魏文成帝的皇后，两度临朝听政。主持推行俸禄制、均田制、三长制等一系列改革，为后来孝文帝的改革打下了基础。`,`改一套制度，要有耐心，更要有后手。`),e(`xuetao`,`薛涛`,`female`,`唐`,`诗人`,[66,70,86,75,92,72,92,50],`唐代女诗人，与元稹、白居易、刘禹锡等人都有诗文往来。晚年居成都浣花溪，自制深红色小笺写诗，后世称为“薛涛笺”。`,`纸是我自己做的，诗也按我自己的意思写。`)],n=(e,t,n,r,i)=>({id:e,scene:t,text:n,source:i,options:r.map(([e,t])=>({text:e,w:t}))}),r=[n(`q01`,`边城告急`,`你守的小城收到急报：敌军三日后就到，援军未必能来。你第一件事做什么？`,[[`立刻定下守城方案，把每个人的位置分派清楚`,{decisive:2,duty:1}],[`先去城里走一圈，看看百姓最怕什么`,{empathy:2}],[`派人连夜摸清敌军虚实和粮道`,{insight:2}],[`想办法让敌军以为城里早有准备`,{create:2,insight:1}]],`安史之乱中张巡、许远死守睢阳`),n(`q02`,`新官上任`,`你被派到一个积弊多年的县做县令。上任第一个月，你会？`,[[`把账目和旧案全部翻出来，先摸清底细`,{insight:2,manage:1}],[`挑一件百姓最痛的事，马上办成`,{decisive:2,duty:1}],[`请乡里德高望重的人来，听他们说说难处`,{empathy:2,express:1}],[`先定几条新规矩，贴在县衙门口`,{manage:2,express:1}]],`战国时西门豹治邺，破除“河伯娶妇”`),n(`q03`,`同门之争`,`两位学者为一部经典的解释争得面红耳赤，都来找你评理。你会？`,[[`回去把原文和旁证都查一遍，再开口`,{insight:2}],[`先让两人把理由各自讲完，帮他们找共同点`,{empathy:2,express:1}],[`直说我认为谁对，理由是什么`,{express:2,independent:1}],[`我有自己的看法，不必站任何一边`,{independent:2}]],`南宋朱熹与陆九渊的“鹅湖之会”`),n(`q04`,`远行之约`,`朝廷招募人出使一个从没人去过的远方，九死一生。你会？`,[[`主动报名，没人走过才值得走`,{create:2,decisive:1}],[`如果需要有人去，我愿意担这个责任`,{duty:2}],[`先打听清楚路线、气候和沿途的人，再决定`,{insight:2}],[`我更适合留下，把后方的补给安排妥当`,{manage:2}]],`汉武帝时张骞应募出使西域`),n(`q05`,`雅集冷场`,`一场文人雅集上大家都很拘谨，没人肯先开口。你会？`,[[`先吟一首，把气氛带起来`,{express:2,decisive:1}],[`出一个新奇的题目，让大家都有话可说`,{create:2}],[`注意到角落里一位紧张的新人，先过去和他聊`,{empathy:2}],[`安静欣赏，不必勉强自己凑热闹`,{independent:2}]],`东晋王羲之等人的兰亭雅集`),n(`q06`,`灾年粮价`,`灾年粮价一天一个样，你手里管着一座粮仓。你会？`,[[`按户限量平价卖粮，每一笔都记清楚`,{manage:2,duty:1}],[`先开仓救最急的人，账以后再算`,{duty:2,empathy:1}],[`反其道而行，放出消息吸引外地粮商运粮进来`,{create:2,manage:1}],[`查清是谁在囤粮抬价`,{insight:2,decisive:1}]],`北宋范仲淹知杭州时以“高价招商”救荒`),n(`q07`,`君前直言`,`你发现君主的一项决定会害很多人，但他正在兴头上。你会？`,[[`当面直说，后果我自己担`,{duty:2,express:1}],[`等他心情平复，找个合适的时机委婉地讲`,{empathy:2,insight:1}],[`写一份条理清楚的奏章，让道理自己说话`,{express:2}],[`先私下准备补救方案，以防万一`,{manage:2,insight:1}]],`魏征屡次犯颜直谏唐太宗`),n(`q08`,`归隐之邀`,`一位老友邀你去山中隐居，远离纷争。你真实的想法是？`,[[`心动，我本来就不想被俗事捆住`,{independent:2}],[`还有放不下的人和事，现在不能走`,{duty:2}],[`去住一阵也好，正好想清楚接下来的路`,{insight:2}],[`山里也能做事，比如办一座新的书院`,{create:2,manage:1}]],`陶渊明辞去彭泽令，归隐田园`),n(`q09`,`两道军令`,`你同时收到两道互相矛盾的命令，来不及请示。你会？`,[[`按我对局势的判断，选一道执行`,{decisive:2,independent:1}],[`核对印信和送信人，先判断哪道是真的`,{insight:2}],[`两道都不全照做，另找一个两全的办法`,{create:2}],[`选伤亡最小的那道，出了错我担`,{duty:2,empathy:1}]],`西汉周亚夫细柳营：“军中闻将军令，不闻天子之诏”`),n(`q10`,`合伙经商`,`一位朋友请你合伙经营一支跑远路的商队。你最先考虑的是？`,[[`账怎么分、风险怎么担，先写清楚`,{manage:2}],[`合伙可以，但我要保留自己拿主意的部分`,{independent:2,manage:1}],[`能不能走一条别人没走过的新线路`,{create:2}],[`做不做，我很快就能给你答复`,{decisive:2}]],`春秋时管仲与鲍叔牙合伙经商，即“管鲍之交”`),n(`q11`,`无端流言`,`有人在背后编排你，话传得很难听。你会？`,[[`不理会，时间会说明一切`,{independent:2}],[`找到源头，公开把事情说清楚`,{express:2,decisive:1}],[`当面去问传话的人，把话问个明白`,{decisive:2,express:1}],[`继续把手上的事做好，做出成绩比辩解有用`,{manage:2,duty:1}]],`西汉直不疑被诬“盗嫂”，只淡淡答一句“我乃无兄”`),n(`q12`,`学生掉队`,`一个资质平平的学生总跟不上，快要放弃了。你会？`,[[`陪着他，找出他到底卡在哪里`,{empathy:2,duty:1}],[`换一种他听得懂的讲法`,{express:2,create:1}],[`给他定几个小目标，一步步练`,{manage:2}],[`告诉他路不止这一条，帮他找更适合的方向`,{create:2,independent:1}]],`孔子“因材施教”`),n(`q13`,`旧法新器`,`祖传的做法做不出主顾要的新器物。你会？`,[[`把旧方法拆开，看问题出在哪一步`,{insight:2}],[`干脆换材料、换思路，从头再来`,{create:2}],[`召集几位老师傅，一起分工琢磨`,{manage:2,empathy:1}],[`定个期限，到期做不出就如实回禀`,{duty:2,decisive:1}]],`北宋毕昇改雕版为活字印刷`),n(`q14`,`众将争功`,`一场大胜之后，众将都在争功。你会？`,[[`把功劳让给手下，他们更需要`,{empathy:2,duty:1}],[`按事实把每个人的功劳写清楚`,{express:2,manage:1}],[`独自走开，功劳不是我在意的`,{independent:2}],[`提醒大家：下一仗比这一仗更难`,{decisive:2,insight:1}]],`东汉冯异每逢论功便退坐树下，人称“大树将军”`),n(`q15`,`迁都之议`,`朝中议论是否迁都，利弊各半，大家都在等你表态。你会？`,[[`想清楚就拍板，拖下去更糟`,{decisive:2}],[`列出两边的账：花费、风险、收益`,{manage:2,insight:1}],[`先去新旧两地亲眼看看`,{insight:2}],[`问问那些要举家搬迁的人怎么想`,{empathy:2}]],`北魏孝文帝以“南伐”为名迁都洛阳`),n(`
